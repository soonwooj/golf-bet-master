<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Golf Bet Pro | 스마트 골프 정산기</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GolfBetPro">
  <meta name="theme-color" content="#059669">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js" 
    integrity="sha384-lSQXvsnB95hIXfH87sqp8fQOamYm9YvDCY9SAn4uY8D4EAbmPebYjnIs0AnInyvT" 
    crossorigin="anonymous"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script>
    // FOUC 방지: 초기 로드 시 다크 모드로 설정 (localStorage 우선)
    (function() {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const storedTheme = localStorage.getItem('theme');
      const useDark = storedTheme === 'dark' || (!storedTheme && prefersDark);
      if (useDark) {
        document.documentElement.classList.add('dark');
      }
      if (document.body) {
        document.body.classList.add('bg-slate-950');
      } else {
        window.addEventListener('DOMContentLoaded', () => {
          document.body.classList.add('bg-slate-950');
        });
      }
    })();
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .safe-top { padding-top: env(safe-area-inset-top); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body class="bg-slate-950 dark:bg-slate-950 transition-colors duration-300">
  <!-- 정적 배너: React 렌더링 전/후에도 항상 표시 -->
  <div class="mx-auto mb-4 p-4 rounded-xl border-2 border-red-500 bg-emerald-600 text-white text-center max-w-7xl">
    <a href="https://www.dealpang.com/?linkD=96LAY5B7a" target="_blank" rel="noreferrer" class="font-black text-lg inline-flex items-center justify-center gap-2">
      ⛳ 골프용품 최저가 쇼핑 (STATIC TEST BANNER)
    </a>
  </div>

  <div id="root"></div>

  <noscript>
    <div class="mx-auto mt-4 p-4 rounded-xl border-2 border-yellow-400 bg-yellow-100 text-black text-center max-w-7xl">
      JavaScript가 비활성화 되어 있어 앱이 실행되지 않습니다. JS를 활성화해주세요.
    </div>
  </noscript>

  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
